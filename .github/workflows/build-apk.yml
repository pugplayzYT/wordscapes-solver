name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already include the Android SDK and
      # command-line tools. Avoid setup-android@v3, which currently tries to
      # install the removed legacy "tools" package and exits with code 1.
      - name: Install Android API 35
        run: |
          echo "Using Android SDK at ${ANDROID_HOME}"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: WordscapesAuto-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
